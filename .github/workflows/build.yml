name: Build dav1d Android ARM64

on:
  workflow_dispatch:

jobs:
  build-dav1d:
    name: Build libdav1d.so - arm64-v8a
    runs-on: ubuntu-latest

    env:
      DAV1D_VERSION: "1.5.4"
      NDK_VERSION: "30.0.16248370"
      NDK_FOLDER: "android-ndk-r30"
      ABI: "arm64-v8a"

    steps:

      # =========================================================
      # 1. Install build dependencies
      # =========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            wget \
            unzip

          echo "===== BUILD TOOLS ====="
          meson --version
          ninja --version
          pkg-config --version
          wget --version | head -n 1
          unzip -v | head -n 1


      # =========================================================
      # 2. Download Android NDK r30
      # =========================================================
      - name: Download Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r30-linux.zip"
          NDK_SHA1="5107f898313790e449e87eee2183d9a20602dee9"

          wget \
            --progress=dot:giga \
            -O android-ndk-r30-linux.zip \
            "$NDK_URL"

          echo "${NDK_SHA1}  android-ndk-r30-linux.zip" \
            | sha1sum -c -

          echo "NDK download and SHA1 verification OK."


      # =========================================================
      # 3. Extract NDK
      # =========================================================
      - name: Extract Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${NDK_FOLDER}"

          unzip \
            -q \
            android-ndk-r30-linux.zip

          test -d "${NDK_FOLDER}"

          echo "NDK:"
          ls -ld "${NDK_FOLDER}"


      # =========================================================
      # 4. Configure NDK environment
      # =========================================================
      - name: Configure NDK environment
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="$GITHUB_WORKSPACE/${NDK_FOLDER}"

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK_PATH"
          test -d "$TOOLCHAIN"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          export PATH="$TOOLCHAIN:$PATH"

          echo "===== NDK PATH ====="
          echo "$NDK_PATH"

          echo
          echo "===== TOOLCHAIN PATH ====="
          echo "$TOOLCHAIN"


      # =========================================================
      # 5. Verify Android ARM64 compiler
      # =========================================================
      - name: Verify Android ARM64 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          test -x "$TOOLCHAIN/aarch64-linux-android21-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang++"
          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-strip"
          test -x "$TOOLCHAIN/llvm-readelf"

          command -v aarch64-linux-android21-clang
          command -v aarch64-linux-android21-clang++
          command -v llvm-ar
          command -v llvm-strip
          command -v llvm-readelf

          echo
          echo "===== CLANG ====="

          aarch64-linux-android21-clang --version

          echo
          echo "===== NDK VERSION ====="

          cat "$ANDROID_NDK_ROOT/source.properties"


      # =========================================================
      # 6. Clone dav1d
      # =========================================================
      - name: Clone dav1d
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${DAV1D_VERSION}" \
            https://github.com/videolan/dav1d.git \
            dav1d

          cd dav1d

          echo "===== DAV1D VERSION ====="

          git describe --tags --always


      # =========================================================
      # 7. Configure dav1d
      # =========================================================
      - name: Configure dav1d
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          cd dav1d

          rm -rf build

          meson setup build \
            --cross-file "package/crossfiles/aarch64-android.meson" \
            --buildtype release \
            --default-library shared \
            --libdir lib \
            --prefix "$PWD/build/install" \
            -Dbitdepths=8,16 \
            -Denable_asm=true \
            -Denable_tools=false \
            -Denable_examples=false \
            -Denable_tests=false \
            -Denable_seek_stress=false \
            -Denable_docs=false \
            -Dtestdata_tests=false \
            -Dlogging=false \
            -Dtrim_dsp=if-release

          echo
          echo "===== CONFIGURE OK ====="

          meson configure build


      # =========================================================
      # 8. Build
      # =========================================================
      - name: Build dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build

          echo "===== BUILD OK ====="


      # =========================================================
      # 9. Install
      # =========================================================
      - name: Install dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build install

          test -d dav1d/build/install/lib

          echo
          echo "===== INSTALLED LIBRARIES ====="

          ls -lah dav1d/build/install/lib

          # IMPORTANT:
          # dav1d 1.5.4 on this Android build produces
          # libdav1d.so directly, not libdav1d.so.*
          test -f dav1d/build/install/lib/libdav1d.so

          echo
          echo "libdav1d.so found successfully."


      # =========================================================
      # 10. Strip library
      # =========================================================
      - name: Strip libdav1d.so
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          LIB="dav1d/build/install/lib/libdav1d.so"

          test -f "$LIB"

          echo "Before strip:"
          ls -lh "$LIB"

          "$TOOLCHAIN/llvm-strip" \
            --strip-unneeded \
            "$LIB"

          echo
          echo "After strip:"
          ls -lh "$LIB"


      # =========================================================
      # 11. Prepare final Android library
      # =========================================================
      - name: Prepare final library
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output

          mkdir -p \
            "output/${ABI}"

          cp \
            "dav1d/build/install/lib/libdav1d.so" \
            "output/${ABI}/libdav1d.so"

          test -f \
            "output/${ABI}/libdav1d.so"

          echo
          echo "===== FINAL LIBRARY ====="

          ls -lh \
            "output/${ABI}/libdav1d.so"


      # =========================================================
      # 12. Verify ELF
      # =========================================================
      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          LIB="output/${ABI}/libdav1d.so"

          test -f "$LIB"

          echo "===== FILE ====="

          file "$LIB"

          echo
          echo "===== ELF HEADER ====="

          "$TOOLCHAIN/llvm-readelf" \
            -h \
            "$LIB"

          echo
          echo "===== ARCHITECTURE CHECK ====="

          "$TOOLCHAIN/llvm-readelf" \
            -h \
            "$LIB" \
            | grep "Machine:"

          echo
          echo "===== REQUIRED LIBRARIES ====="

          "$TOOLCHAIN/llvm-readelf" \
            -d \
            "$LIB" \
            | grep NEEDED || true

          echo
          echo "===== FINAL SIZE ====="

          ls -lh "$LIB"


      # =========================================================
      # 13. Upload artifact
      # =========================================================
      - name: Upload libdav1d.so
        uses: actions/upload-artifact@v4
        with:
          name: libdav1d-android-arm64
          path: output/arm64-v8a/libdav1d.so
          if-no-files-found: error
