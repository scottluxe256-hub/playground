name: Build dav1d Android ARM64

on:
  workflow_dispatch:

jobs:
  build-dav1d:
    name: Build libdav1d.so - arm64-v8a
    runs-on: ubuntu-latest

    env:
      DAV1D_VERSION: "1.5.4"
      NDK_VERSION: "30.0.16248370"
      NDK_FOLDER: "android-ndk-r30"
      ABI: "arm64-v8a"

    steps:

      # =========================================================
      # 1. Install build dependencies
      # =========================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            wget \
            unzip

          echo "===== VERSIONS ====="
          meson --version
          ninja --version
          pkg-config --version
          wget --version | head -n 1
          unzip -v | head -n 1


      # =========================================================
      # 2. Download Android NDK r30 directly
      # =========================================================
      - name: Download Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r30-linux.zip"

          NDK_SHA1="5107f898313790e449e87eee2183d9a20602dee9"

          echo "Downloading Android NDK ${NDK_VERSION}..."

          wget \
            --progress=dot:giga \
            -O android-ndk-r30-linux.zip \
            "$NDK_URL"

          echo "===== SHA1 CHECK ====="

          echo "${NDK_SHA1}  android-ndk-r30-linux.zip" \
            | sha1sum -c -

          echo "SHA1 OK."


      # =========================================================
      # 3. Extract Android NDK
      # =========================================================
      - name: Extract Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${NDK_FOLDER}"

          unzip \
            -q \
            android-ndk-r30-linux.zip

          test -d "${NDK_FOLDER}"

          echo "NDK extracted:"
          ls -ld "${NDK_FOLDER}"


      # =========================================================
      # 4. Configure NDK environment
      # =========================================================
      - name: Configure NDK toolchain
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="$GITHUB_WORKSPACE/${NDK_FOLDER}"

          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$NDK_PATH"
          test -d "$TOOLCHAIN"

          # Persist for following GitHub Actions steps
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          # Also export immediately for this step
          export PATH="$TOOLCHAIN:$PATH"

          echo "===== NDK ====="
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "===== TOOLCHAIN ====="
          echo "$TOOLCHAIN"

          echo
          echo "===== PATH ====="
          echo "$PATH"


      # =========================================================
      # 5. Verify Android compiler
      # =========================================================
      - name: Verify Android compiler
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          echo "===== COMPILER ====="

          command -v aarch64-linux-android21-clang
          command -v aarch64-linux-android21-clang++
          command -v llvm-ar
          command -v llvm-strip
          command -v llvm-readelf

          echo
          echo "===== CLANG VERSION ====="

          aarch64-linux-android21-clang --version

          echo
          echo "===== NDK VERSION ====="

          cat "$ANDROID_NDK_ROOT/source.properties"

          echo
          echo "===== TARGET COMPILER ====="

          ls -lh \
            "$TOOLCHAIN/aarch64-linux-android21-clang"


      # =========================================================
      # 6. Clone official dav1d 1.5.4
      # =========================================================
      - name: Clone dav1d
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${DAV1D_VERSION}" \
            https://github.com/videolan/dav1d.git \
            dav1d

          cd dav1d

          echo "===== DAV1D VERSION ====="

          git describe --tags --always


      # =========================================================
      # 7. Configure dav1d
      # =========================================================
      - name: Configure dav1d
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          cd dav1d

          rm -rf build

          meson setup build \
            --cross-file "package/crossfiles/aarch64-android.meson" \
            --buildtype release \
            --default-library shared \
            --libdir lib \
            --prefix "$PWD/build/install" \
            -Dbitdepths=8,16 \
            -Denable_asm=true \
            -Denable_tools=false \
            -Denable_examples=false \
            -Denable_tests=false \
            -Denable_seek_stress=false \
            -Denable_docs=false \
            -Dtestdata_tests=false \
            -Dlogging=false \
            -Dtrim_dsp=if-release

          echo
          echo "===== MESON SUMMARY ====="

          meson configure build


      # =========================================================
      # 8. Build
      # =========================================================
      - name: Build dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build


      # =========================================================
      # 9. Install
      # =========================================================
      - name: Install dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build install

          test -d dav1d/build/install/lib
          test -d dav1d/build/install/include


      # =========================================================
      # 10. Locate the generated library
      # =========================================================
      - name: Locate libdav1d
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="dav1d/build/install"

          echo "===== LIB DIRECTORY ====="

          ls -lah "$PREFIX/lib"

          LIB_FILE="$(
            find "$PREFIX/lib" \
              -maxdepth 1 \
              -type f \
              -name 'libdav1d.so.*' \
              -print \
              -quit
          )"

          test -n "$LIB_FILE"
          test -f "$LIB_FILE"

          echo "DAV1D_LIBRARY=$LIB_FILE" >> "$GITHUB_ENV"

          echo
          echo "Selected library:"
          echo "$LIB_FILE"

          echo
          ls -lh "$LIB_FILE"


      # =========================================================
      # 11. Strip
      # =========================================================
      - name: Strip libdav1d
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/llvm-strip" \
            --strip-unneeded \
            "$DAV1D_LIBRARY"

          echo "===== AFTER STRIP ====="

          ls -lh "$DAV1D_LIBRARY"


      # =========================================================
      # 12. Prepare Android library
      # =========================================================
      - name: Prepare output
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output

          mkdir -p \
            "output/${ABI}"

          # Dereference versioned shared library into the
          # Android-friendly filename libdav1d.so
          cp \
            "$DAV1D_LIBRARY" \
            "output/${ABI}/libdav1d.so"

          test -f "output/${ABI}/libdav1d.so"

          echo "===== FINAL FILE ====="

          ls -lh \
            "output/${ABI}/libdav1d.so"


      # =========================================================
      # 13. Verify ELF architecture
      # =========================================================
      - name: Verify ELF
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          LIB="output/${ABI}/libdav1d.so"

          test -f "$LIB"

          echo "===== FILE ====="

          file "$LIB"

          echo
          echo "===== ELF HEADER ====="

          "$TOOLCHAIN/llvm-readelf" \
            -h \
            "$LIB"

          echo
          echo "===== ELF MACHINE CHECK ====="

          "$TOOLCHAIN/llvm-readelf" \
            -h \
            "$LIB" \
            | grep -E "Class:|Machine:"

          echo
          echo "===== NEEDED LIBRARIES ====="

          "$TOOLCHAIN/llvm-readelf" \
            -d \
            "$LIB" \
            | grep NEEDED || true

          echo
          echo "===== FINAL SIZE ====="

          ls -lh "$LIB"


      # =========================================================
      # 14. Upload artifact
      # =========================================================
      - name: Upload libdav1d
        uses: actions/upload-artifact@v4
        with:
          name: libdav1d-android-arm64
          path: output/arm64-v8a/libdav1d.so
          if-no-files-found: error
