name: Build dav1d Android ARM64

on:
  workflow_dispatch:

jobs:
  build-dav1d:
    name: Build libdav1d.so (arm64-v8a)
    runs-on: ubuntu-latest

    env:
      DAV1D_VERSION: "1.5.4"
      NDK_VERSION: "30.0.16248370"
      NDK_DIR: "android-ndk-r30"
      ABI: "arm64-v8a"

    steps:

      # ---------------------------------------------------------
      # 1. Install build dependencies
      # ---------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            nasm \
            pkg-config \
            wget \
            unzip

          meson --version
          ninja --version
          nasm -v
          pkg-config --version


      # ---------------------------------------------------------
      # 2. Setup Android SDK command-line tools
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ---------------------------------------------------------
      # 3. Download Android NDK r30 directly
      # ---------------------------------------------------------
      - name: Download Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-r30-linux.zip"
          NDK_SHA1="5107f898313790e449e87eee2183d9a20602dee9"

          echo "Downloading Android NDK ${NDK_VERSION}..."

          wget \
            --progress=dot:giga \
            -O android-ndk-r30-linux.zip \
            "$NDK_URL"

          echo "Checking SHA1..."

          echo "${NDK_SHA1}  android-ndk-r30-linux.zip" | sha1sum -c -

          echo "Extracting NDK..."

          unzip \
            -q \
            android-ndk-r30-linux.zip

          test -d "${NDK_DIR}"

          echo "NDK extracted successfully."

          ls -ld "${NDK_DIR}"


      # ---------------------------------------------------------
      # 4. Setup NDK environment
      # ---------------------------------------------------------
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          NDK_PATH="$GITHUB_WORKSPACE/${NDK_DIR}"

          test -d "$NDK_PATH"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "NDK path:"
          echo "$NDK_PATH"


      # ---------------------------------------------------------
      # 5. Verify NDK toolchain
      # ---------------------------------------------------------
      - name: Verify NDK
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android21-clang"
          test -x "$TOOLCHAIN/aarch64-linux-android21-clang++"
          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-strip"
          test -x "$TOOLCHAIN/llvm-readelf"

          echo "===== CLANG ====="

          "$TOOLCHAIN/aarch64-linux-android21-clang" \
            --version

          echo
          echo "===== NDK VERSION ====="

          cat "$ANDROID_NDK_ROOT/source.properties"

          echo
          echo "===== TOOLCHAIN ====="

          ls -lh \
            "$TOOLCHAIN/aarch64-linux-android21-clang"


      # ---------------------------------------------------------
      # 6. Clone official dav1d
      # ---------------------------------------------------------
      - name: Clone dav1d
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${DAV1D_VERSION}" \
            https://github.com/videolan/dav1d.git

          cd dav1d

          echo "dav1d version:"
          git describe --tags --always


      # ---------------------------------------------------------
      # 7. Configure dav1d
      # ---------------------------------------------------------
      - name: Configure dav1d
        shell: bash
        run: |
          set -euxo pipefail

          cd dav1d

          rm -rf build

          meson setup build \
            --cross-file "package/crossfiles/aarch64-android.meson" \
            --buildtype release \
            --default-library shared \
            --libdir lib \
            --prefix "$PWD/build/install" \
            -Dbitdepths=8,16 \
            -Denable_asm=true \
            -Denable_tools=false \
            -Denable_examples=false \
            -Denable_tests=false \
            -Denable_seek_stress=false \
            -Denable_docs=false \
            -Dtestdata_tests=false \
            -Dlogging=false \
            -Dtrim_dsp=if-release

          echo
          echo "===== MESON CONFIGURATION ====="

          meson configure build


      # ---------------------------------------------------------
      # 8. Build
      # ---------------------------------------------------------
      - name: Build dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build


      # ---------------------------------------------------------
      # 9. Install
      # ---------------------------------------------------------
      - name: Install dav1d
        shell: bash
        run: |
          set -euxo pipefail

          ninja -C dav1d/build install

          test -d "dav1d/build/install/lib"
          test -d "dav1d/build/install/include"


      # ---------------------------------------------------------
      # 10. Locate libdav1d
      # ---------------------------------------------------------
      - name: Locate libdav1d
        shell: bash
        run: |
          set -euxo pipefail

          PREFIX="dav1d/build/install"

          echo "Installed libraries:"
          find "$PREFIX/lib" -maxdepth 1 -type f -o -type l | sort

          LIB_FILE="$(
            find "$PREFIX/lib" \
              -maxdepth 1 \
              -type f \
              -name 'libdav1d.so.*' \
              -print -quit
          )"

          test -n "$LIB_FILE"
          test -f "$LIB_FILE"

          echo "DAV1D_LIBRARY=$LIB_FILE" >> "$GITHUB_ENV"

          echo
          echo "Found library:"
          ls -lh "$LIB_FILE"


      # ---------------------------------------------------------
      # 11. Strip library
      # ---------------------------------------------------------
      - name: Strip libdav1d
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/llvm-strip" \
            --strip-unneeded \
            "$DAV1D_LIBRARY"

          echo "After strip:"
          ls -lh "$DAV1D_LIBRARY"


      # ---------------------------------------------------------
      # 12. Rename to libdav1d.so
      # ---------------------------------------------------------
      - name: Prepare shared library
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output/arm64-v8a

          cp \
            "$DAV1D_LIBRARY" \
            output/arm64-v8a/libdav1d.so

          test -f output/arm64-v8a/libdav1d.so

          echo "Final library:"
          ls -lh output/arm64-v8a/libdav1d.so


      # ---------------------------------------------------------
      # 13. Verify ELF
      # ---------------------------------------------------------
      - name: Verify ELF
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "===== FILE ====="

          file \
            output/arm64-v8a/libdav1d.so

          echo
          echo "===== ELF HEADER ====="

          "$TOOLCHAIN/llvm-readelf" \
            -h \
            output/arm64-v8a/libdav1d.so

          echo
          echo "===== NEEDED LIBRARIES ====="

          "$TOOLCHAIN/llvm-readelf" \
            -d \
            output/arm64-v8a/libdav1d.so \
            | grep NEEDED || true

          echo
          echo "===== FINAL SIZE ====="

          ls -lh \
            output/arm64-v8a/libdav1d.so


      # ---------------------------------------------------------
      # 14. Upload artifact
      # ---------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libdav1d-android-arm64
          path: output/arm64-v8a/libdav1d.so
          if-no-files-found: error
