name: Build libavif Native Binary (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build libavif (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      # 1. Install tool wajib untuk kompilasi
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm cmake

      # 2. Setup Android NDK
      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      # 3. Kloning Source Code libavif Terbaru
      - name: Clone libavif Repository
        run: git clone --depth 1 https://github.com/AOMediaCodec/libavif.git

      # 4. Unduh Dependencies (dav1d, aom, dan libyuv)
      - name: Fetch Dependencies
        run: |
          cd libavif/ext
          bash dav1d.cmd
          bash aom.cmd
          bash libyuv.cmd

      # 5. Kompilasi khusus arm64-v8a dengan tambahan libyuv
      - name: Compile libavif to .so
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          cd libavif
          mkdir build_arm64
          cd build_arm64
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DAVIF_CODEC_DAV1D=LOCAL \
            -DAVIF_CODEC_AOM=LOCAL \
            -DAVIF_LIBYUV=LOCAL
          
          cmake --build . --parallel 4

      # 6. Menyiapkan folder struktur jniLibs/arm64-v8a
      - name: Prepare jniLibs Folder
        run: |
          mkdir -p jniLibs/arm64-v8a
          cp libavif/build_arm64/libavif.so jniLibs/arm64-v8a/

      # 7. Upload File .so sebagai Artifact
      - name: Upload arm64 .so File
        uses: actions/upload-artifact@v4
        with:
          name: libavif-arm64-v8a
          path: jniLibs/arm64-v8a/
