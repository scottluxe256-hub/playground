name: Build libavif Native Binary (arm64-v8a) - Lite

on:
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build libavif Lite (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Clone libavif Repository
        run: git clone --depth 1 https://github.com/AOMediaCodec/libavif.git

      - name: Cross-Compile Dependencies for Android (Decoder Only)
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          TOOLCHAIN="$NDK_PATH/build/cmake/android.toolchain.cmake"
          
          cd libavif/ext
          
          # 1. Build libyuv
          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv.git
          cd libyuv
          mkdir build.libavif && cd build.libavif
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=MinSizeRel
          ninja
          cd ../..
          
          # 2. Build libaom (Matikan Encoder untuk hemat ukuran)
          git clone -b v3.9.1 --depth 1 https://aomedia.googlesource.com/aom
          cd aom
          mkdir build.libavif && cd build.libavif
          cmake -G Ninja .. \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCONFIG_AV1_ENCODER=0 \
            -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTDATA=0 -DENABLE_TESTS=0 -DENABLE_TOOLS=0
          ninja
          cd ../..

      - name: Compile & Strip libavif.so
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          STRIP_TOOL="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          
          cd libavif
          mkdir build_arm64
          cd build_arm64
          
          # Gunakan MinSizeRel (Optimize for Size)
          cmake -G Ninja .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBUILD_SHARED_LIBS=ON \
            -DAVIF_CODEC_AOM=LOCAL \
            -DAVIF_LIBYUV=LOCAL
          
          ninja
          
          # Hapus seluruh debug symbol menggunakan llvm-strip bawaan NDK
          echo "Ukuran sebelum strip:"
          ls -lh libavif.so
          $STRIP_TOOL --strip-unneeded libavif.so
          echo "Ukuran setelah strip:"
          ls -lh libavif.so

      - name: Prepare jniLibs Folder
        run: |
          mkdir -p jniLibs/arm64-v8a
          cp libavif/build_arm64/libavif.so jniLibs/arm64-v8a/

      - name: Upload arm64 .so File
        uses: actions/upload-artifact@v4
        with:
          name: libavif-arm64-v8a
          path: jniLibs/arm64-v8a/
