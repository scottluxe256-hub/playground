name: Build libavif Native Binary (arm64-v8a)

on:
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build libavif (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      # 1. Install tool wajib untuk kompilasi (Ninja jauh lebih cepat dan anti-error dibanding Make)
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      # 2. Setup Android NDK
      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      # 3. Kloning Source Code libavif
      - name: Clone libavif Repository
        run: git clone --depth 1 https://github.com/AOMediaCodec/libavif.git

      # 4. CROSS-COMPILE DEPENDENCIES KHUSUS ANDROID (Solusi Error arsitektur)
      - name: Cross-Compile Dependencies for Android
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          TOOLCHAIN="$NDK_PATH/build/cmake/android.toolchain.cmake"
          
          cd libavif/ext
          
          # a. Build libyuv untuk Android arm64
          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv.git
          cd libyuv
          mkdir build.libavif && cd build.libavif
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release
          ninja
          cd ../..
          
          # b. Build libaom (Encoder & Decoder) untuk Android arm64
          git clone -b v3.9.1 --depth 1 https://aomedia.googlesource.com/aom
          cd aom
          mkdir build.libavif && cd build.libavif
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release -DENABLE_DOCS=0 -DENABLE_EXAMPLES=0 -DENABLE_TESTDATA=0 -DENABLE_TESTS=0 -DENABLE_TOOLS=0
          ninja
          cd ../..

      # 5. Kompilasi libavif.so menggabungkan aom & libyuv Android di atas
      - name: Compile libavif to .so
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/25.2.9519653"
          cd libavif
          mkdir build_arm64
          cd build_arm64
          
          cmake -G Ninja .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DAVIF_CODEC_AOM=LOCAL \
            -DAVIF_LIBYUV=LOCAL
          
          ninja

      # 6. Menyiapkan folder struktur jniLibs/arm64-v8a
      - name: Prepare jniLibs Folder
        run: |
          mkdir -p jniLibs/arm64-v8a
          cp libavif/build_arm64/libavif.so jniLibs/arm64-v8a/

      # 7. Upload File .so sebagai Artifact
      - name: Upload arm64 .so File
        uses: actions/upload-artifact@v4
        with:
          name: libavif-arm64-v8a
          path: jniLibs/arm64-v8a/
